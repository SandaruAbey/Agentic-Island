appId: com.agenticisland.app
productName: Agentic Island
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack: []
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: AgenticIsland-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  differentialPackage: false
  useZip: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agentic Island
  runAfterFinish: true
  deleteAppDataOnUninstall: false
extraResources:
  - from: build/icon.png
    to: icon.png
  # Optional: your Google "Desktop app" OAuth client for "Sign in with Google" (see README).
  - from: build
    to: .
    filter:
      - google-oauth.json
